name: Daily forecast

# Late evening, on purpose. To forecast TOMORROW the model needs TODAY
# essentially complete; a morning run would be forecasting today instead.
# 21:00 UTC is 22:00 CET / 23:00 CEST.
#
# GitHub's scheduler can drift by up to an hour under load, so the run never
# assumes what day it is — src/daily_run.py reads the real clock.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# Only one run at a time: two concurrent runs could both read the ledger before
# either wrote it, and one forecast would be lost.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No `pip install`. The model is a JSON of coefficients and inference is a
      # sigmoid, so the run needs nothing but the standard library — which makes
      # it both faster and much harder to break.
      - name: Score yesterday, forecast tomorrow
        id: forecast
        run: python src/daily_run.py

      # The page reads prebuilt files, so the ledger growing is not enough:
      # without this the record fills up while the published page stays frozen.
      - name: Rebuild the page bundle
        run: python src/build_site.py

      # Runs even when the build above fails. Until this step pushes, the
      # forecasts issued minutes ago exist nowhere but this runner and die with
      # it: that is how 2026-09-06 to 2026-09-20 went missing, a failing build
      # sitting in front of the commit for fifteen evenings. A page that will
      # not rebuild is the smaller loss, and the job still ends red.
      - name: Commit the ledger and the bundle
        if: ${{ !cancelled() && steps.forecast.outcome == 'success' }}
        run: |
          paths="public/forecasts.jsonl docs/data/bundle.json docs/data/ledger.json"
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "nothing changed — nothing to commit"
            exit 0
          fi
          git config user.name  "rain-tomorrow bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $paths
          # The commit message carries the date, so `git log` alone shows that
          # each forecast was published before the day it forecasts.
          git commit -m "forecasts issued $(date -u +%Y-%m-%d)"
          git push
